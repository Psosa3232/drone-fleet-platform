version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: drone_fleet_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drone_fleet}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - drone-network

  redis:
    image: redis:7-alpine
    container_name: drone_fleet_redis
    ports:
      - "6379:6379"
    networks:
      - drone-network

  app:
    build: .
    container_name: drone_fleet_app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-drone_fleet}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - db
      - redis
    networks:
      - drone-network

volumes:
  pgdata:

networks:
  drone-network:
    driver: bridge